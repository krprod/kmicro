services:
      postgres:
            image: postgres:16
            container_name: springmicro-postgres
            environment:
                  POSTGRES_DB: springmicro
                  POSTGRES_USER: bloguser
                  POSTGRES_PASSWORD: bloguser
            ports:
                  - "${POSTGRES_PORT:-55432}:5432"
            volumes:
                  - postgres_data:/var/lib/postgresql/data
            healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U bloguser -d springmicro"]
                  interval: 10s
                  timeout: 5s
                  retries: 10
            restart: unless-stopped

      redis:
            image: redis:7-alpine
            container_name: springmicro-redis
            ports:
                  - "${REDIS_PORT:-56379}:6379"
            volumes:
                  - redis_data:/data
            healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 10s
                  timeout: 5s
                  retries: 10
            restart: unless-stopped

      kafka:
            image: confluentinc/cp-kafka:7.5.0
            container_name: springmicro-kafka
            ports:
                  - "${KAFKA_EXTERNAL_PORT:-59092}:9092"
                  - "${KAFKA_INTERNAL_PORT:-29092}:29092"
            environment:
                  KAFKA_NODE_ID: 1
                  KAFKA_PROCESS_ROLES: "broker,controller"
                  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
                  KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
                  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-59092}"
                  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
                  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
                  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
                  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
                  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
                  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
                  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
                  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
            healthcheck:
                  test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
                  interval: 10s
                  timeout: 5s
                  retries: 20
                  start_period: 30s
            restart: unless-stopped

      kafbat-ui:
            image: ghcr.io/kafbat/kafka-ui:latest
            container_name: springmicro-kafbat-ui
            ports:
                  - "${KAFBAT_UI_PORT:-58080}:8080"
            depends_on:
                  kafka:
                        condition: service_healthy
            environment:
                  KAFKA_CLUSTERS_0_NAME: springmicro-cluster
                  KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
                  DYNAMIC_CONFIG_ENABLED: "true"
            restart: unless-stopped

      product-service:
            image: maven:3.9.9-eclipse-temurin-21
            container_name: springmicro-product
            working_dir: /workspace/product
            command: mvn -DskipTests spring-boot:run
            volumes:
                  - ../../:/workspace
                  - maven_repo:/root/.m2
            environment:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/springmicro?currentSchema=product_schema
                  SPRING_DATASOURCE_USERNAME: bloguser
                  SPRING_DATASOURCE_PASSWORD: bloguser
                  SPRING_DATA_REDIS_HOST: redis
                  SPRING_DATA_REDIS_PORT: 6379
                  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
                  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
            ports:
                  - "${PRODUCT_PORT:-8080}:8080"
            depends_on:
                  postgres:
                        condition: service_healthy
                  redis:
                        condition: service_healthy
                  kafka:
                        condition: service_healthy
#                  commons-builder:
#                        condition: service_completed_successfully
            restart: unless-stopped

      user-service:
            image: maven:3.9.9-eclipse-temurin-21
            container_name: springmicro-user
            working_dir: /workspace/user
            command: mvn -DskipTests spring-boot:run
            volumes:
                  - ../../:/workspace
                  - maven_repo:/root/.m2
            environment:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/springmicro?currentSchema=user_schema
                  SPRING_DATASOURCE_USERNAME: bloguser
                  SPRING_DATASOURCE_PASSWORD: bloguser
                  SPRING_DATA_REDIS_HOST: redis
                  SPRING_DATA_REDIS_PORT: 6379
                  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
                  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
                  VERIFICATION_LINK_URI: "${VERIFICATION_LINK_URI}:http://localhost:5173/auth/verify/"
            ports:
                  - "${USER_PORT:-8085}:8085"
            depends_on:
                  postgres:
                        condition: service_healthy
                  redis:
                        condition: service_healthy
                  kafka:
                        condition: service_healthy
#                  commons-builder:
#                        condition: service_completed_successfully
            restart: unless-stopped

      order-service:
            image: maven:3.9.9-eclipse-temurin-21
            container_name: springmicro-order
            working_dir: /workspace/order
            command: mvn -DskipTests spring-boot:run
            volumes:
                  - ../../:/workspace
                  - maven_repo:/root/.m2
            environment:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/springmicro?currentSchema=order_schema
                  SPRING_DATASOURCE_USERNAME: bloguser
                  SPRING_DATASOURCE_PASSWORD: bloguser
                  SPRING_DATA_REDIS_HOST: redis
                  SPRING_DATA_REDIS_PORT: 6379
                  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
                  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
                  FRONTEND_URL: "${FRONTEND_URL}:http://localhost:5173"
            ports:
                  - "${ORDER_PORT:-8091}:8091"
            depends_on:
                  postgres:
                        condition: service_healthy
                  redis:
                        condition: service_healthy
                  kafka:
                        condition: service_healthy
#                  commons-builder:
#                        condition: service_completed_successfully
            restart: unless-stopped

      notification-service:
            image: maven:3.9.9-eclipse-temurin-21
            container_name: springmicro-notification
            working_dir: /workspace/notification
            command: mvn -DskipTests spring-boot:run
            volumes:
                  - ../../:/workspace
                  - maven_repo:/root/.m2
            environment:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/springmicro?currentSchema=notification_schema
                  SPRING_DATASOURCE_USERNAME: bloguser
                  SPRING_DATASOURCE_PASSWORD: bloguser
                  SPRING_DATA_REDIS_HOST: redis
                  SPRING_DATA_REDIS_PORT: 6379
                  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
                  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
                  SMTP_SERVER: "${SMTP_SERVER}"
                  SMTP_PORT: 587
                  SMTP_LOGIN: "${SMTP_LOGIN}"
                  SMTP_KEY: "${SMTP_KEY}"
                  NO_REPLY_MAIL_ADDRESS: "${NO_REPLY_MAIL_ADDRESS}"
            ports:
                  - "${NOTIFICATION_PORT:-8096}:8096"
            depends_on:
                  postgres:
                        condition: service_healthy
                  redis:
                        condition: service_healthy
                  kafka:
                        condition: service_healthy
            restart: unless-stopped

