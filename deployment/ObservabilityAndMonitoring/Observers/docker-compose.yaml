---
networks:
      kmicro:
            driver: "bridge"

services:
  read:
    image: grafana/loki:latest
    command: "-config.file=/etc/loki/config.yaml -target=read -query-scheduler.use-scheduler-ring=false"
    ports:
      - 3101:3100
      - 7946
      - 9095
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks: &loki-dns
      kmicro:
        aliases:
          - loki

  write:
    image: grafana/loki:latest
    command: "-config.file=/etc/loki/config.yaml -target=write"
    ports:
      - 3102:3100
      - 7946
      - 9095
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - minio
    networks:
      <<: *loki-dns

  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:  run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - 12345:12345
#      - 12347:12347 # Add this for Faro collection
    depends_on:
      - gateway
    extends:
          file: common-config.yml
          service: network-deploy-service

  minio:
    image: minio/minio
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - 9000
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5
    extends:
          file: common-config.yml
          service: network-deploy-service

  prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        volumes:
              - ./prometheus.yml:/etc/prometheus/prometheus.yml
        ports:
              - "9090:9090"
        restart: unless-stopped
        extends:
              file: common-config.yml
              service: network-deploy-service

  tempo:
        image: grafana/tempo:2.9.0
        container_name: tempo
        command: -config.file /etc/tempo-config.yml
        ports:
              - "3110:3100"
              - "4318:4318"
        volumes:
              - ./tempo.yml:/etc/tempo-config.yml
        extends:
              file: common-config.yml
              service: network-deploy-service

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - gateway
    entrypoint:
      - sh
      - -euc
      - |
            /run.sh
    ports:
      - "3000:3000"
    volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana-datasource/datasource.yml:/etc/grafana/provisioning/datasources/ds.yaml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    extends:
          file: common-config.yml
          service: network-deploy-service

  backend:
    image: grafana/loki:latest
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
    ports:
      - "3100"
      - "7946"
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false"
    depends_on:
      - gateway
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    extends:
          file: common-config.yml
          service: network-deploy-service

  gateway:
    image: nginx:latest
    depends_on:
      - read
      - write
    entrypoint:
      - sh
      - -euc
      - |
        cat <<EOF > /etc/nginx/nginx.conf
        user  nginx;
        worker_processes  5;  ## Default: 1

        events {
          worker_connections   1000;
        }

        http {
          resolver 127.0.0.11;

          server {
            listen             3100;

            location = / {
              return 200 'OK';
              auth_basic off;
            }

            location = /api/prom/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /api/prom/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /api/prom/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }

            location = /loki/api/v1/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /loki/api/v1/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /loki/api/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }
          }
        }
        EOF
        /docker-entrypoint.sh nginx -g "daemon off;"
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    extends:
          file: common-config.yml
          service: network-deploy-service

  postgres:
      image: postgres:16
      container_name: springmicro-postgres-1
      environment:
            POSTGRES_DB: springmicro
            POSTGRES_USER: bloguser
            POSTGRES_PASSWORD: bloguser
#      ports:
#            - "${POSTGRES_PORT:-55432}:5432"
      volumes:
            - postgres_data:/var/lib/postgresql/data
      healthcheck:
            test: ["CMD-SHELL", "pg_isready -U bloguser -d springmicro"]
            interval: 10s
            timeout: 5s
            retries: 10
      restart: unless-stopped
      extends:
            file: common-config.yml
            service: network-deploy-service

  redis:
      image: redis:7-alpine
      container_name: springmicro-redis-1
#      ports:
#            - "${REDIS_PORT:-56379}:6379"
      volumes:
            - redis_data:/data
      healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
      restart: unless-stopped
      extends:
            file: common-config.yml
            service: network-deploy-service

  kafka:
      image: confluentinc/cp-kafka:7.5.0
      container_name: springmicro-kafka-1
      ports:
            - "${KAFKA_EXTERNAL_PORT:-59092}:9092"
            - "${KAFKA_INTERNAL_PORT:-29092}:29092"
      environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: "broker,controller"
            KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
            KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
            KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-59092}"
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
            KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
            CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      healthcheck:
            test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
            interval: 10s
            timeout: 5s
            retries: 20
            start_period: 30s
      restart: unless-stopped
      extends:
            file: common-config.yml
            service: network-deploy-service

  kafbat-ui:
      image: ghcr.io/kafbat/kafka-ui:latest
      container_name: springmicro-kafbat-ui-1
      ports:
            - "${KAFBAT_UI_PORT:-58080}:8080"
      depends_on:
            kafka:
                  condition: service_healthy
      environment:
            KAFKA_CLUSTERS_0_NAME: springmicro-cluster
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
            DYNAMIC_CONFIG_ENABLED: "true"
      restart: unless-stopped
      extends:
            file: common-config.yml
            service: network-deploy-service

  product-service:
      image: "kmicro/product:s1"
      container_name: springmicro-product-1
      environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/springmicro?currentSchema=product_schema
            SPRING_DATASOURCE_USERNAME: bloguser
            SPRING_DATASOURCE_PASSWORD: bloguser
            SPRING_DATA_REDIS_HOST: redis
            SPRING_DATA_REDIS_PORT: 6379
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
            KAFKA_BOOTSTRAP_SERVERS: kafka:29092
            OTEL_SERVICE_NAME: "product-service"
#      ports:
#            - "${PRODUCT_PORT:-8080}:8080"
      healthcheck:
            test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
            interval: 20s
            timeout: 5s
            retries: 20
            start_period: 10s
      depends_on:
            postgres:
                  condition: service_healthy
            redis:
                  condition: service_healthy
            kafka:
                  condition: service_healthy
      restart: unless-stopped
      extends:
            file: common-config.yml
            service: microservice-base-config

  user-service:
      image: "kmicro/user:s1"
      container_name: springmicro-user-1
      environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/springmicro?currentSchema=user_schema
            SPRING_DATASOURCE_USERNAME: bloguser
            SPRING_DATASOURCE_PASSWORD: bloguser
            SPRING_DATA_REDIS_HOST: redis
            SPRING_DATA_REDIS_PORT: 6379
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
            KAFKA_BOOTSTRAP_SERVERS: kafka:29092
            VERIFICATION_LINK_URI: "${VERIFICATION_LINK_URI:-http://localhost:5173/auth/verify/}"
            OTEL_SERVICE_NAME: "user-service"
            JWT_SECRET: "${JWT_SECRET:-jxgEQeXHuPq8VdbyYFNkANdudQ53YUn4}"
#      ports:
#            - "${USER_PORT:-8085}:8085"
      healthcheck:
            test: "curl --fail --silent localhost:8085/actuator/health/readiness | grep UP || exit 1"
            interval: 20s
            timeout: 5s
            retries: 20
            start_period: 10s
      depends_on:
            postgres:
                  condition: service_healthy
            redis:
                  condition: service_healthy
            kafka:
                  condition: service_healthy
      restart: unless-stopped
      extends:
            file: common-config.yml
            service: microservice-base-config

  order-service:
      image: "kmicro/order:s1"
      container_name: springmicro-order-1
      environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/springmicro?currentSchema=order_schema
            SPRING_DATASOURCE_USERNAME: bloguser
            SPRING_DATASOURCE_PASSWORD: bloguser
            SPRING_DATA_REDIS_HOST: redis
            SPRING_DATA_REDIS_PORT: 6379
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
            KAFKA_BOOTSTRAP_SERVERS: kafka:29092
            FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
            OTEL_SERVICE_NAME: "order-service"
#      ports:
#            - "${ORDER_PORT:-8091}:8091"
      healthcheck:
            test: "curl --fail --silent localhost:8091/actuator/health/readiness | grep UP || exit 1"
            interval: 20s
            timeout: 5s
            retries: 20
            start_period: 10s
      depends_on:
            postgres:
                  condition: service_healthy
            redis:
                  condition: service_healthy
            kafka:
                  condition: service_healthy
      restart: unless-stopped
      extends:
            file: common-config.yml
            service: microservice-base-config

  notification-service:
      image: "kmicro/notification:s1"
      container_name: springmicro-notification-1
      environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/springmicro?currentSchema=notification_schema
            SPRING_DATASOURCE_USERNAME: bloguser
            SPRING_DATASOURCE_PASSWORD: bloguser
            SPRING_DATA_REDIS_HOST: redis
            SPRING_DATA_REDIS_PORT: 6379
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
            KAFKA_BOOTSTRAP_SERVERS: kafka:29092
            SMTP_SERVER: "${SMTP_SERVER}"
            SMTP_PORT: 587
            SMTP_LOGIN: "${SMTP_LOGIN}"
            SMTP_KEY: "${SMTP_KEY}"
            NO_REPLY_MAIL_ADDRESS: "${NO_REPLY_MAIL_ADDRESS}"
            OTEL_SERVICE_NAME: "notification-service"
#      ports:
#            - "${NOTIFICATION_PORT:-8096}:8096"
      healthcheck:
            test: "curl --fail --silent localhost:8096/actuator/health/readiness | grep UP || exit 1"
            interval: 20s
            timeout: 5s
            retries: 20
            start_period: 10s
      depends_on:
            postgres:
                  condition: service_healthy
            redis:
                  condition: service_healthy
            kafka:
                  condition: service_healthy
      restart: unless-stopped
      extends:
            file: common-config.yml
            service: microservice-base-config



  apiGateway-service:
        image: "kmicro/apigateway:s2"
        container_name: springmicro-apiGateway-1
        environment:
              SPRING_DATA_REDIS_HOST: redis
              SPRING_DATA_REDIS_PORT: 6379
              OTEL_SERVICE_NAME: "apiGateway-service"
              JWT_SECRET: "${JWT_SECRET:-jxgEQeXHuPq8VdbyYFNkANdudQ53YUn4}"
              frontURL: "${FRONTEND_URL:-http://localhost:5173}"
              NOTIFICATION_HOST: notification-service
              NOTIFICATION_PORT: 8096
              ORDER_HOST: order-service
              ORDER_PORT: 8091
              PRODUCT_HOST: product-service
              PRODUCT_PORT: 8080
              USER_HOST: user-service
              USER_PORT: 8085
        ports:
              - "${API_GATEWAY_PORT:-9096}:9096"
        depends_on:
              order-service:
                    condition: service_healthy
              user-service:
                    condition: service_healthy
              product-service:
                    condition: service_healthy
              notification-service:
                    condition: service_healthy
        deploy:
              resources:
                    limits:
                          memory: 512M
        restart: unless-stopped
        extends:
              file: common-config.yml
              service: microservice-base-config

  cloudflared:
      image: cloudflare/cloudflared:latest
      container_name: cloudflared-tunnel
      restart: always
      environment:
            - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      command: tunnel run
      extends:
            file: common-config.yml
            service: network-deploy-service

  frontend-service:
      build:
            context: "/home/k/Code/Projects/ReactKmicroUI/kmicro-frontend"  # Change this to your actual folder path
            dockerfile: Dockerfile
            args:
                  - VITE_API_BASE_URL=/api
      container_name: springmicro-frontend-1
      ports:
            - "5173:80"  # Maps port 80 in container to 5173 on your machine
      environment:
            - VITE_API_BASE_URL=https://api.bloodshot.in  # Use your tunnel URL here
      restart: unless-stopped
      extends:
            file: common-config.yml
            service: network-deploy-service

#  faro-collector:
#        image: grafana/faro-collector:latest
#        ports:
#              - "12345:12345"
#        environment:
#              - FARO_COLLECTOR_LOKI_URL=http://loki:3100/loki/api/v1/push
#              - FARO_COLLECTOR_TEMPO_URL=http://tempo:4317
#              - FARO_COLLECTOR_PROMETHEUS_URL=http://prometheus:9090/api/v1/write
#        volumes:
#              - ./faro-collector-config.yaml:/etc/faro/config.yaml
#        command:
#              - "--config.file=/etc/faro/config.yaml"
#        extends:
#              file: common-config.yml
#              service: network-deploy-service

volumes:
      grafana_data:
      postgres_data:
      redis_data:
      maven_repo: