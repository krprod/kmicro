server:
      port: 8085
spring:
      application:
            name: user-service
      profiles:
            active: "prod"
      datasource:
            url: jdbc:postgresql://localhost:5432/springmicro?currentSchema=user_schema
            username: bloguser
            password: bloguser
            driver-class-name: org.postgresql.Driver
            hikari:
                  pool-name: userServiceHikariPool
                  maximum-pool-size: 10
                  minimum-idle: 5
                  idle-timeout: 300000 # 5 minutes
                  connection-timeout: 20000 # 20 seconds
                  max-lifetime: 1200000 # 20 minutes
                  auto-commit: true
            flyway:
                  enabled: true
                  schemas: user_schema
                  baseline-on-migrate: true # Crucial for existing databases
                  out-of-order: false        # Strict linear progression in prod
                  lock-retry-count: 50 # Retries before failing
                  locations:
                        - classpath:db/migration
#                  table: user_schema_history
      jpa:
#            show-sql: true
            hibernate:
                  ddl-auto: validate
            properties:
                  hibernate:
                        default_schema: user_schema
                        #This helps format the SQL logs to be readable
                        format_sql: true
      kafka:
            bootstrap-servers: localhost:9092
            #            producer:
            #                  key-serializer: org.apache.kafka.common.serialization.StringSerializer
            #                  value-serializer: org.apache.kafka.common.serialization.StringSerializer
            ##                  acks: all
            #                  properties:
            #                        enable.idempotence: true
            #                  consumer:
            #                        group-id: notification-group
            #                        auto-offset-reset: earliest
            #                        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            #                        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            properties:
                  enable.idempotence: true
                  compression.type: snappy
            #            # Retry & DLT Logic (Requires Spring Kafka 2.7+)
            retry:
                  topic:
                        enabled: true
                        attempts: 3
                        delay: 5000 # 5 seconds between retries

      redis:
            host: localhost
            port: 6379

logging:
      level:
            org:
                  springframework:
#                        cache: TRACE
#      pattern:
#            level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
#                        security: DEBUG
#                        kafka: DEBUG
#                  hibernate:
#                        orm:
#                              jdbc:
#                                    bind: TRACE
management:
      endpoints:
            web:
                  exposure:
                        include: "*"
      health:
            readiness-state:
                  enabled: true
            liveness-state:
                  enabled: true
            jdbc:
                  enabled: true
      endpoint:
            shutdown:
                  access: unrestricted
            health:
                  probes:
                        enabled: true
      info:
            env:
                  enabled: true
      metrics:
            tags:
                  application: ${spring.application.name}

auth:
      jwt:
            secret: ${JWT_SECRET:asdf}

springwolf:
      docket:
            base-package: com.kmicro.user
            servers:
                  kafka-server:
                        url: ${KAFKA_BOOTSTRAP_SERVERS}
                        protocol: KAFKA
                        host: localhost:9092
            info:
                  title: User Service Kafka Doc
                  version: 1.0.0
                  description: AsyncAPI documentation for the User Microservice
      ui:
            path: /springwolf/asyncapi-ui.html
      scanner:
            async-api-json:
                  path: /springwolf/docs

springdoc:
      api-docs:
            path: /v3/api-docs
      swagger-ui:
            path: /swagger-ui/index.html
      server:
            url: http://localhost:9096/user-service